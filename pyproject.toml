[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glediator3"
dynamic = ["version"]
description = "Real-time LED matrix visualizer and mixer"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "PySide6>=6.6",
    "Pillow>=10.0",
    "websockets>=12.0",
    "mss>=9.0",
    "soundcard>=0.4.3",
    "av>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=5.0", "pytest-qt>=4.4", "ruff>=0.3"]
osc = ["python-osc>=1.8"]
camera = ["opencv-python-headless>=4.9"]

[project.scripts]
glediator = "glediator.app:main"

[tool.setuptools.packages.find]
include = ["glediator*"]

[tool.setuptools.package-data]
"glediator.assets.fonts" = ["*.ttf"]

[tool.setuptools.dynamic]
version = {attr = "glediator.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF012", "RUF001"]
