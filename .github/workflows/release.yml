name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: glediator-linux
          - os: windows-latest
            artifact: glediator-windows
          - os: macos-latest
            artifact: glediator-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux Qt system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0
      - name: Install build dependencies
        run: python -m pip install -e ".[osc]" pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm glediator.spec
      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.artifact }}.tar.gz -C dist Glediator
      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist\Glediator -DestinationPath ${{ matrix.artifact }}.zip
      - uses: softprops/action-gh-release@v2
        with:
          name: Glediator ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
