name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux Qt system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check glediator tests scripts
      - name: Run tests with coverage gate
        run: >
          python -m pytest -q
          --cov=glediator/core
          --cov=glediator/output
          --cov=glediator.audio.features
          --cov=glediator/network
          --cov=glediator/control
          --cov-fail-under=75

  firmware:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Compile ESP32 sketch
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          sketch-paths: |
            - esp32-firmware
          libraries: |
            - ESP32 HUB75 LED MATRIX PANEL DMA Display
            - WebSockets
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
